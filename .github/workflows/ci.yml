name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + build + test
    runs-on: ubuntu-latest

    # Postgres for integration tests. `#[sqlx::test]` provisions an isolated
    # database per test on this server (the default superuser has CREATEDB).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taxloss
          POSTGRES_PASSWORD: taxloss
          POSTGRES_DB: taxloss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxloss"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://taxloss:taxloss@localhost:5432/taxloss

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  frontend:
    name: frontend (tsc + vite build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs `tsc --noEmit` then `vite build`, so this both
      # type-checks and verifies the production bundle compiles.
      - name: Type-check + build
        run: npm run build

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taxloss
          POSTGRES_PASSWORD: taxloss
          POSTGRES_DB: taxloss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxloss"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://taxloss:taxloss@localhost:5432/taxloss

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage (summary + lcov)
        run: |
          cargo llvm-cov --workspace --summary-only
          cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

