[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/domain",
    "crates/db",
    "crates/plaid",
]

# Shared dependency versions are declared once here and referenced from each
# crate with `workspace = true`. This keeps versions consistent across the
# workspace and is the idiomatic way to manage a multi-crate Rust project.
[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "rust_decimal",
    "uuid",
    "json",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"

# Local crates
domain = { path = "crates/domain" }
db = { path = "crates/db" }
plaid = { path = "crates/plaid" }
