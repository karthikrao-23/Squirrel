[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/domain",
    "crates/db",
    "crates/plaid",
]

# Shared dependency versions are declared once here and referenced from each
# crate with `workspace = true`. This keeps versions consistent across the
# workspace and is the idiomatic way to manage a multi-crate Rust project.
[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = [
    "trace",
    "cors",
    "fs",
    "limit",
    "timeout",
    "set-header",
] }
tower_governor = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "rust_decimal",
    "uuid",
    "json",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
aes-gcm = { version = "0.10", features = ["std"] }
base64 = "0.22"
rand = "0.8"
# Auth: password hashing (argon2id), session-token hashing, cookies, constant-time
# comparison, rate limiting, and email/password normalization.
argon2 = "0.5"
sha2 = "0.10"
axum-extra = { version = "0.10", features = ["cookie"] }
subtle = "2"
email_address = "0.2"
unicode-normalization = "0.1"
# Plaid webhook signature verification (ES256 JWT).
jsonwebtoken = "9"
tokio-cron-scheduler = "0.13"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "tokio1",
    "tokio1-rustls-tls",
    "smtp-transport",
] }

# Local crates
domain = { path = "crates/domain" }
db = { path = "crates/db" }
plaid = { path = "crates/plaid" }
